name: Deploy UI
run-name: Deploying UI to Prod
on:
  push:
    #paths: app/**
  workflow_dispatch:
jobs:
  web-deploy:
    runs-on: ubuntu-latest
    container: node:21
    steps:
      - name: 🚚 Get Latest Code
        uses: actions/checkout@v3

      - name: Install rsync
        run: |
          apt-get update
          apt-get -y install rsync

      - name: Install Deps
        run: |
          npm install
          npm run build
        working-directory: ${{ github.workspace }}/app/
      - run: |
          ls
        working-directory: ${{ github.workspace }}/app/dist/app/browser

      - run: >
          touch ~/.ssh/yait_ssh_key
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/yait_ssh_key
          rsync 
          -e "
          ssh -p 22 
          -i ~/.ssh/yait_ssh_key 
          -o StrictHostKeyChecking=no" 
          --archive 
          --verbose 
          --compress 
          --human-readable 
          --progress 
          --delete-after ./* ${{secrets.REMOTE_USER}}@${{secrets.TARGET_SERVER}}:${{ secrets.DESTINATION_PATH}}
        working-directory: ${{ github.workspace }}/app/dist/app/browser

      # - name: 📂 Sync Files
