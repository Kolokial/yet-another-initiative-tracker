name: Deploy UI
run-name: Deploying UI to Prod
on: [push]
jobs:
  web-deploy:
    runs-on: ubuntu-latest
    container: node:21
    steps:
      - name: 🚚 Get Latest Code
        uses: actions/checkout@v3

      - name: Install Deps
        run: |
          npm install
          npm run build
          ls -l ${{ github.workspace }}/app/dist/
        working-directory: ${{ github.workspace }}/app/

