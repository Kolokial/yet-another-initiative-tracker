@if ((roomId | async) == '') {
  <div>
    <div class="flex-container">
      <div class="flex-container flex-item card">
        <mat-form-field class="flex-item">
          <mat-label>Room Code</mat-label>
          <input
            [(ngModel)]="roomCode"
            matInput
            placeholder="Ex. l33tdnd"
            (keyup.enter)="joinRoom(roomCode, userType)"
          />
        </mat-form-field>
        <mat-button-toggle-group
          [(ngModel)]="userType"
          [hideSingleSelectionIndicator]="true"
          vertical
          name="user-type"
          aria-label="Font Style"
        >
          <mat-button-toggle value="player">Player</mat-button-toggle>
          <mat-button-toggle value="dungeon-master">Dungeon Master</mat-button-toggle>
          <mat-button-toggle value="spectator">Spectator</mat-button-toggle>
        </mat-button-toggle-group>
        <button
          class="flex-item"
          mat-flat-button
          color="primary"
          (click)="joinRoom(roomCode, userType)"
          [disabled]="!roomCode"
        >
          Join Room
        </button>
        <div class="flex-item">Join your friends room!</div>
      </div>

      <div class="flex-container flex-item card">
        <button class="flex-item" mat-flat-button color="primary" (click)="createRoom()">
          Create Room
        </button>
        <div class="flex-item">Make a brand new room!</div>
      </div>
    </div>
  </div>
} @else {
  @if (userType === 'dungeon-master') {
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="center">
      <mat-tab label="RoomId: {{ roomId | async }}">
        <initiative-list></initiative-list>
      </mat-tab>
      <mat-tab label="DM Tools"> <dm-tools></dm-tools></mat-tab>
      <!-- <mat-tab label="Third">Content 3</mat-tab> -->
    </mat-tab-group>
  } @else {
    <p>RoomId: {{ roomId | async }}</p>
    <initiative-list></initiative-list>
  }
}
