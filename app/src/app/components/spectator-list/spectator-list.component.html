<table mat-table [dataSource]="spectatorList" class="mat-elevation-z8" matSort>
  <ng-container matColumnDef="displayName">
    <th mat-header-cell *matHeaderCellDef>Player</th>
    <td mat-cell *matCellDef="let element">
      <span class="player-character-name">{{ element.playerCharacterName | async }}</span>
      <span class="display-name">{{ element.displayName | async }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="initiativeValue">
    <th mat-header-cell *matHeaderCellDef>Initiative</th>
    <td mat-cell *matCellDef="let element">
      {{ element.initiativeValue }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
