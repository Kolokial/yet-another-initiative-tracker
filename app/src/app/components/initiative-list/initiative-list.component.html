@if (!isDungeonMaster) {
  <div class="action-button-container">
    <button
      class="action-butons-flex-item"
      mat-fab
      extended
      (click)="sendTurnFinishedMessage()"
      [disabled]="turnFinishedButtonEnabled$ | async"
    >
      <mat-icon>door_open</mat-icon>
      End Turn
    </button>

    <button
      (click)="openInitiativeTracker()"
      class="action-butons-flex-item"
      [disabled]="selectedCharacter === null"
      mat-fab
      extended
    >
      <mat-icon></mat-icon>
      Roll
    </button>
  </div>
}
<table mat-table [dataSource]="initiatives" class="mat-elevation-z8" matSort>
  @if (isDungeonMaster) {
    <ng-container matColumnDef="rollDice">
      <th mat-header-cell *matHeaderCellDef>Roll</th>
      <td mat-cell *matCellDef="let element">
        <button
          mat-icon-button
          *ngIf="element.auth0Id.startsWith(auth0Id)"
          aria-label="Roll"
          (click)="openInitiativeTracker()"
        >
          <mat-icon>casino</mat-icon>
        </button>
      </td>
    </ng-container>
  }
  <ng-container matColumnDef="displayName">
    <th mat-header-cell *matHeaderCellDef>Player</th>
    <td mat-cell *matCellDef="let element">
      <div class="player-character-name">{{ element.name }}</div>
      <span class="display-name">{{ element.displayName }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="initiativeValue">
    <th mat-header-cell *matHeaderCellDef>Initiative</th>
    <td mat-cell *matCellDef="let element">
      {{ element.initialInitiative }}
    </td>
  </ng-container>

  @if (isDungeonMaster) {
    <ng-container matColumnDef="endTurn">
      <th mat-header-cell *matHeaderCellDef>End Turn</th>
      <td mat-cell *matCellDef="let element">
        <button
          *ngIf="element.auth0Id.startsWith(auth0Id)"
          mat-icon-button
          aria-label="End Turn"
        >
          <mat-icon>check_circle</mat-icon>
        </button>
      </td>
    </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
