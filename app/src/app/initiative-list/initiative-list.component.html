<table mat-table [dataSource]="initiatives" class="mat-elevation-z8" matSort>
  <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="displayName">
    <th mat-header-cell *matHeaderCellDef>Player</th>
    <td mat-cell *matCellDef="let element">{{ element.displayName }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="initiativeValue">
    <th mat-header-cell *matHeaderCellDef>initiativeValue</th>
    <td mat-cell *matCellDef="let element">
      {{ element.initiativeValue ? element.initiativeValue : '-' }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
