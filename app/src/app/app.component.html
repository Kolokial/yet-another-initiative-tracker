<nav mat-tab-nav-bar [tabPanel]="tabPanel">
  <a
    mat-tab-link
    [routerLink]="roomUrl"
    routerLinkActive="active"
    (click)="activeLink = roomUrl"
    [active]="activeLink == ''"
  >
    <mat-icon
      aria-hidden="false"
      aria-label="Room Manager"
      fontIcon="room_preferences"
    ></mat-icon>
    <span class="nav-label">Room Manager</span>
  </a>
  <a
    mat-tab-link
    routerLink="/init/"
    routerLinkActive="active"
    (click)="activeLink = '/init'"
    [active]="activeLink == ''"
  >
    <mat-icon
      aria-hidden="false"
      aria-label="Initiative Tracker"
      fontIcon="casino"
    ></mat-icon>
    <span class="nav-label">Initiative Tracker</span>
  </a>
  <a
    mat-tab-link
    routerLink="/order/"
    routerLinkActive="active"
    (click)="activeLink = '/order'"
    [active]="activeLink == ''"
  >
    <mat-icon
      aria-hidden="false"
      aria-label="Initiative Order"
      fontIcon="table_chart"
    ></mat-icon>
    <span class="nav-label">Initative Order</span>
  </a>
</nav>
<h2 class="nav-title">{{ componentTitle }}</h2>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
<router-outlet (activate)="onActivate($event)"></router-outlet>
